server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}/${PGDATABASE}?sslmode=${PGSSLMODE:require}&channel_binding=${PGCHANNELBINDING:require}
    username: ${PGUSER}
    password: ${PGPASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/